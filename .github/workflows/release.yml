name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The release notes are the CHANGELOG entry for this tag, not a dump of
      # commit subjects. It FAILS if the section is missing: an empty notes
      # file would publish a release nobody can read, and nothing downstream
      # would report it. A failed job here is visible and re-runnable once the
      # entry is added, which is the cheaper of the two outcomes.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # One awk, so there is no `tac` dependency and no second process to
          # fail silently. Blank lines are held back until the next non-blank
          # line arrives, which trims the leading and trailing blanks around
          # the section while preserving the ones between its subsections.
          # index(), not a regex: the version is interpolated into the pattern,
          # and a tag carrying semver build metadata (v1.0.0+build) would make
          # `+` a quantifier and match nothing — failing the job with "no
          # section for v1.0.0+build", which points at the changelog instead of
          # at this line. A literal comparison cannot be wrong about that.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside {
              if (NF == 0) { if (started) pending = pending "\n"; next }
              started = 1
              printf "%s%s\n", pending, $0
              pending = ""
            }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section for tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Release notes ($(wc -c < /tmp/release-notes.md) bytes):"
          cat /tmp/release-notes.md

      # A release is a tagged magmux built against a TAGGED claudestate. A
      # pseudo-version pin is a development state (architecture §7): tag
      # claudestate/vX.Y.Z on the merge commit and bump the root first.
      - name: Refuse a release that pins claudestate at a pseudo-version
        run: |
          if grep -qE 'github.com/MadAppGang/magmux/claudestate v[^ ]*[0-9]{14}-[0-9a-f]{12}' go.mod; then
            echo "::error::claudestate is pinned at a pseudo-version; tag claudestate/vX.Y.Z on the merge commit and bump before releasing magmux"
            exit 1
          fi

      # claudestate/v* tags live in the same repository. GoReleaser would
      # otherwise take the nearest tag of ANY family as the previous release.
      # The `if` form is deliberate: under bash -e a trailing `[ -n "" ] && …`
      # exits 1 and would fail the step on a first release.
      - name: Pin GoReleaser's tags to the v* family
        run: |
          echo "GORELEASER_CURRENT_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then echo "GORELEASER_PREVIOUS_TAG=${prev}" >> "$GITHUB_ENV"; fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
