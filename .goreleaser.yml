version: 2

project_name: magmux

before:
  hooks:
    - go mod tidy

builds:
  - id: magmux
    main: ./cmd/magmux
    binary: magmux
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/MadAppGang/magmux/buildinfo.Version={{.Version}} -X github.com/MadAppGang/magmux/buildinfo.Commit={{.ShortCommit}}

archives:
  - id: magmux
    # `formats` (plural, a list) replaces the deprecated singular `format`.
    # A pure rename: the artifact name, extension and contents are unchanged,
    # so every published checksum and every Homebrew url keeps its shape.
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Casks, not formulas. GoReleaser deprecated `brews` because the formulas it
# generated were a hack: they declared a source build and then installed a
# pre-compiled binary. That was the only way to reach Linuxbrew when it was
# written; Homebrew has shipped a Linux Caskroom since
# (Library/Homebrew/extend/os/linux/cask/caskroom.rb), so a cask now covers
# both platforms and is what a downloaded binary should have been all along.
#
# This MOVES the artifact in the tap, Formula/magmux.rb -> Casks/magmux.rb.
# Anyone who installed the old formula is migrated by tap_migrations.json in
# the tap repository; without that file their `brew upgrade` would silently
# find nothing and leave them pinned forever.
#
# One capability is lost and is not replaceable: casks have no `test` stanza,
# so `brew test magmux` no longer runs `magmux --version`. The formula's test
# was itself the subject of a fixed bug, so it is worth saying plainly that
# nothing now checks the published binary from Homebrew's side — and nothing
# checks it from ours either: `.github/workflows/release.yml` extracts the
# changelog section and runs GoReleaser, and that is all. No published artifact
# is downloaded or executed by anything, so a binary that cannot start would
# reach users with every check green.
homebrew_casks:
  - name: magmux
    binaries:
      - magmux
    repository:
      owner: MadAppGang
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/MadAppGang/magmux
    description: Minimal terminal multiplexer written in Go. Zero third-party dependencies.
    # LOAD-BEARING, and measured rather than assumed.
    #
    # The quarantine is not something a Go binary attracts, and it is nothing to
    # do with .app bundles — Gatekeeper enforces com.apple.quarantine on any
    # Mach-O executable. Two separate steps produce it, and only the second is
    # ours:
    #   1. Homebrew quarantines whatever it DOWNLOADS. The tarball in
    #      ~/Library/Caches/Homebrew/downloads carries the attribute before
    #      anything is extracted.
    #   2. CASKS copy it onto the extracted payload (Quarantine.propagate,
    #      cask/download.rb:129). FORMULAS never call it — every call site is
    #      under cask/.
    # Being unsigned is not why the attribute is applied; it is why Gatekeeper
    # then REFUSES the quarantined file. Installing the cask without this strip,
    # on a real machine: com.apple.quarantine was set on the staged binary and
    # `magmux --version` produced no output — Gatekeeper killed it while
    # `brew install` still reported success, the worst shape a failure can take.
    #
    # Written through custom_block, not `hooks.post.install`: that key renders a
    # `postflight do` wrapper, which Homebrew deprecated in favour of the
    # declarative `postflight_steps` (cask/dsl.rb, INSTALL_STEP_ARTIFACT_CLASSES).
    # `run` and `on_macos` are both permitted steps. Needs Homebrew >= 6.0.0, the
    # first release carrying that DSL.
    #
    # GoReleaser runs custom_block through Go templates, and Homebrew's own
    # staged_path token is brace-delimited too, so it is emitted as a string
    # literal. Written directly it fails the render as an undefined function.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/magmux"]
        end
      end
